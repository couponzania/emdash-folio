name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          v="v$(node -p 'require("./package.json").version')"
          [ "$GITHUB_REF_NAME" = "$v" ] || { echo "tag $GITHUB_REF_NAME does not match $v"; exit 1; }
